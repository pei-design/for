<meta property="og:title" content="給 季璇 的一頁｜Angel&#x27;s Liquid"><meta property="og:description" content="你說運動像苦甜巧克力，一開始很辛苦，習慣了就很值得。這一頁也想慢慢來：我們把你的故事和我們的故事，整理成六個小章節。"><meta property="og:image" content="https://pei-design.github.io/for/assets/img/group.jpg"><meta property="og:url" content="https://pei-design.github.io/for/winniewu/"><meta name="theme-color" content="#D12A3B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>/* Layout: a six-chapter booklet for one creator — sticky chapter rail, creator story → brand story → where they meet → her day → guess → collaborate; brand crimson, single light look */
:root{
  --crimson:#D12A3B; --crimson-deep:#A81E2D; --ink:#17181B; --text:#2A2B2F; --muted:#6B6E75;
  --white:#FFFFFF; --page:#FBFAFA; --blush:#FCEEF0; --blush-2:#F4D6DB; --line:#EDE4E6; --marker:#FFF0A3;
  --f-serif:"Noto Serif TC","Songti TC",serif;
  --f-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--page);color:var(--text);font-family:var(--f-sans);font-size:16px;line-height:1.85}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--white)}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--f-serif);color:var(--ink);margin:0;text-wrap:balance;line-height:1.4}
p{margin:0}
img{display:block;max-width:100%}
.label{font-family:var(--f-serif);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--crimson)}
mark{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit;padding:0 2px;white-space:nowrap}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--crimson);outline-offset:3px}

/* chapter rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.rail .inner{display:flex;align-items:center;gap:14px;padding-block:10px;overflow-x:auto;scrollbar-width:none}
.rail .inner::-webkit-scrollbar{display:none}
.rail .brand{font-family:var(--f-serif);font-weight:700;color:var(--ink);white-space:nowrap;font-size:14px}
.rail nav{display:flex;gap:4px;margin-left:auto}
.rail a{white-space:nowrap;text-decoration:none;font-size:13px;color:var(--muted);padding:5px 10px;border-radius:999px}
.rail a b{font-family:var(--f-serif);color:var(--crimson);margin-right:4px}
.rail a.on{background:var(--blush);color:var(--crimson);font-weight:700}
.bar{height:2px;background:var(--crimson);width:0;transition:width .15s linear}

/* chapter frame */
.ch{padding-block:84px}
.ch-head{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-bottom:40px;max-width:46em}
.ch-no{font-family:var(--f-serif);font-weight:900;font-size:64px;line-height:.9;color:var(--blush-2)}
.ch-head h2{font-size:clamp(26px,3.8vw,36px);font-weight:900;margin-top:6px}
.ch-head p{color:var(--muted);margin-top:10px}
.alt{background:var(--white)}

/* cover */
.cover{background:var(--crimson);color:var(--white)}
.cover .inner{padding-block:64px 72px;display:grid;grid-template-columns:1.2fr .8fr;gap:44px;align-items:end}
.cover .label{color:#FFD6DB}
.cover h1{color:var(--white);font-size:clamp(34px,5.8vw,58px);font-weight:900;line-height:1.22;margin:16px 0 20px}
.cover p{color:#FFE9EC;max-width:30em}
.toc{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:2px}
.toc .label{margin-bottom:8px}
.toc a{display:grid;grid-template-columns:30px 1fr;color:var(--white);text-decoration:none;padding:7px 0;border-top:1px solid rgba(255,255,255,.16);font-size:15px}
.toc a:first-of-type{border-top:0}
.toc a b{font-family:var(--f-serif);color:#FFD6DB}
.toc a:hover span{text-decoration:underline}
.from{margin-top:24px;font-size:14px;color:#FFD6DB}
@media (max-width:800px){.cover .inner{grid-template-columns:1fr}}

/* ch1 timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.tl li{padding:20px 18px 0 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.tl .yr{font-family:var(--f-serif);font-weight:900;font-size:30px;color:var(--crimson);font-variant-numeric:tabular-nums;line-height:1.2}
.tl b{color:var(--ink);font-size:17px}
.tl span{font-size:15px;color:var(--muted)}
@media (max-width:800px){.tl{grid-template-columns:1fr 1fr;row-gap:26px}}
@media (max-width:440px){.tl{grid-template-columns:1fr}}
.quote{margin-top:48px;background:var(--blush);border-radius:20px;padding:34px 36px;display:grid;grid-template-columns:auto 1fr;gap:22px}
.quote .q{font-family:var(--f-serif);font-size:72px;line-height:.8;color:var(--crimson)}
.quote blockquote{margin:0;font-family:var(--f-serif);font-weight:700;font-size:clamp(20px,2.8vw,26px);color:var(--ink);line-height:1.6}
.quote cite{display:block;margin-top:10px;font-style:normal;font-size:13px;color:var(--muted)}
.quote p{margin-top:16px}
@media (max-width:560px){.quote{grid-template-columns:1fr;padding:26px}}

/* ch2 brand story: alternating image/text rows */
.rows{display:flex;flex-direction:column;gap:56px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.row.flip-r .media{order:2}
.row .media{background:var(--white);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row .media img{width:100%;height:auto}
.row .txt{display:flex;flex-direction:column;gap:12px}
.row .txt h3{font-size:clamp(21px,2.6vw,25px);font-weight:900}
.row .big{font-family:var(--f-serif);font-weight:900;font-size:clamp(40px,6vw,56px);color:var(--crimson);line-height:1}
.row .big small{font-size:18px;color:var(--muted);font-weight:700;margin-left:6px}
@media (max-width:800px){.row{grid-template-columns:1fr;gap:20px}.row.flip-r .media{order:0}}
.proofs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:56px}
.proof{background:var(--blush);border-radius:14px;padding:16px 12px;text-align:center}
.proof b{display:block;font-family:var(--f-serif);font-weight:900;font-size:24px;color:var(--crimson);line-height:1.25}
.proof span{font-size:13px;color:var(--muted)}
@media (max-width:700px){.proofs{grid-template-columns:1fr 1fr}}
.doc{margin-top:12px;background:var(--ink);color:#D9DADD;border-radius:14px;padding:14px 18px;font-size:14px}
.doc b{color:var(--white);font-family:var(--f-serif)}

/* ch3 meet */
.meet{display:flex;flex-direction:column;gap:12px}
.pair{display:grid;grid-template-columns:1fr 64px 1fr;align-items:stretch;gap:0}
.pair > div{background:var(--white);border:1px solid var(--line);padding:20px 22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pair .you{border-radius:16px 0 0 16px}
.pair .us{border-radius:0 16px 16px 0;background:var(--blush);border-color:var(--blush-2)}
.pair .mid{background:var(--crimson);border:0;color:var(--white);align-items:center;justify-content:center;font-family:var(--f-serif);font-weight:900;font-size:15px;padding:8px;text-align:center;line-height:1.4}
.pair .who{font-size:12px;letter-spacing:.12em;font-weight:700;color:var(--muted);font-family:var(--f-serif)}
.pair b{font-family:var(--f-serif);font-size:18px;color:var(--ink)}
@media (max-width:640px){.pair{grid-template-columns:1fr}.pair .you{border-radius:16px 16px 0 0}.pair .us{border-radius:0 0 16px 16px}.pair .mid{padding:6px}}

/* ch4 day */
.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.scene{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px 18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:inherit;min-width:0}
.scene .t{font-family:var(--f-serif);font-size:13px;letter-spacing:.1em;color:var(--crimson);font-weight:700}
.scene b{font-family:var(--f-serif);font-size:19px;color:var(--ink);line-height:1.45}
.scene span{font-size:14px;color:var(--muted)}
.scene[aria-pressed="true"]{border-color:var(--crimson);background:var(--blush);box-shadow:0 0 0 2px var(--blush-2)}
@media (max-width:860px){.scenes{grid-template-columns:1fr 1fr}}

.answer{margin-top:16px;background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:220px 1fr}
.answer img{width:100%;height:100%;object-fit:cover;background:#F2F1F3}
.answer .body{padding:24px 26px;display:flex;flex-direction:column;gap:8px;min-width:0}
.answer .name{font-family:var(--f-serif);font-weight:900;font-size:22px;color:var(--ink)}
.answer .spec{font-size:14px;color:var(--crimson);font-weight:700}
@media (max-width:600px){.answer{grid-template-columns:1fr}.answer img{height:220px}}
.routine{margin-top:64px;background:var(--ink);border-radius:24px;padding:34px;display:grid;grid-template-columns:240px 1fr;gap:34px;align-items:center;color:#D9DADD}
.routine h3{color:var(--white);font-size:24px;font-weight:900}
.ring{position:relative;width:100%;max-width:240px;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring .sec{font-family:var(--f-serif);font-weight:900;font-size:60px;line-height:1;color:var(--white);font-variant-numeric:tabular-nums}
.ring .face small{font-size:12px;color:#A9ABB1;letter-spacing:.1em}
.rsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.rstep{border-radius:14px;overflow:hidden;background:#24262B;border:2px solid transparent;transition:border-color .3s,opacity .3s;opacity:.55}
.rstep.on{border-color:var(--crimson);opacity:1}
.rstep img{width:100%;aspect-ratio:1;object-fit:cover}
.rstep div{padding:10px 12px;font-size:13px;line-height:1.5}
.rstep b{display:block;color:var(--white);font-family:var(--f-serif);font-size:15px}
.go{margin-top:18px;background:var(--crimson);color:var(--white);border:0;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer}
.go:hover{background:var(--crimson-deep)}
@media (max-width:760px){.routine{grid-template-columns:1fr;padding:24px}.ring{margin:0 auto;max-width:200px}}


/* ch5 flips */
.flips{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.flip{perspective:900px;border:0;background:none;padding:0;cursor:pointer;min-height:220px;text-align:left}
.flip .card{position:relative;width:100%;height:100%;min-height:220px;transition:transform .6s;transform-style:preserve-3d}
.flip[aria-pressed="true"] .card{transform:rotateY(180deg)}
.flip .side{position:absolute;inset:0;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{background:var(--white);border:1.5px dashed var(--blush-2)}
.flip .front b{font-family:var(--f-serif);font-size:20px;color:var(--ink);line-height:1.45}
.flip .front span{margin-top:auto;font-size:13px;color:var(--crimson);font-weight:700}
.flip .back{background:var(--crimson);color:var(--white);transform:rotateY(180deg)}
.flip .back .t{font-size:12px;letter-spacing:.14em;color:#FFD6DB;font-family:var(--f-serif);font-weight:700}
@media (prefers-reduced-motion:reduce){.flip .card{transition:none}}
@media (max-width:780px){.flips{grid-template-columns:1fr}}

/* ch6 */
.ideas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.idea{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px}
.idea .fmt{font-size:12px;font-weight:700;color:var(--crimson);letter-spacing:.06em}
.idea h3{font-size:19px;font-weight:900}
.idea p{font-size:15px;color:var(--muted)}
.aside{margin-top:16px;font-size:14px;color:var(--muted);border-left:3px solid var(--crimson);padding-left:12px}
@media (max-width:780px){.ideas{grid-template-columns:1fr}}
.steps{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.steps li{border-top:2px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.steps li::before{counter-increment:s;content:"STEP 0" counter(s);font-family:var(--f-serif);font-size:12px;letter-spacing:.14em;color:var(--crimson);font-weight:700}
.steps b{font-family:var(--f-serif);font-size:19px;color:var(--ink)}
.steps span{color:var(--muted);font-size:15px}
.perk{margin-top:22px;display:inline-block;background:var(--marker);color:var(--ink);font-weight:700;padding:6px 14px;border-radius:8px;font-size:15px}
@media (max-width:640px){.steps{grid-template-columns:1fr}}

/* reply */
.reply{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:34px;display:grid;grid-template-columns:.9fr 1.1fr;gap:34px}
@media (max-width:780px){.reply{grid-template-columns:1fr;padding:24px}}
.reply .head{display:flex;flex-direction:column;gap:10px}
.reply .head h2{font-size:clamp(26px,3.6vw,32px);font-weight:900}
.reply .head p{color:var(--muted)}
.reply .form{display:flex;flex-direction:column;gap:16px;min-width:0}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>span{font-size:14px;font-weight:700;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--page);color:var(--text);cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--crimson);background:var(--blush);color:var(--crimson);font-weight:700}
label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,textarea{font:inherit;color:var(--text);background:var(--page);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
textarea{min-height:80px;resize:vertical}
.send{background:var(--crimson);color:var(--white);border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;cursor:pointer}
.send:hover{background:var(--crimson-deep)}
.out{background:var(--blush);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.out pre{margin:0;white-space:pre-wrap;font-family:var(--f-sans);font-size:15px}
.ghost{align-self:flex-start;background:var(--white);border:1px solid var(--crimson);color:var(--crimson);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px}
.addr{font-weight:700;color:var(--ink);user-select:all}
.gift{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--blush);border-radius:14px;padding:10px;}
.gift img{width:96px;height:64px;object-fit:cover;border-radius:10px}
.gift b{display:block;font-family:var(--f-serif);color:var(--ink);font-size:17px}
.gift span{font-size:14px;color:var(--muted)}
.ship{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ship .wide{grid-column:1/-1}
@media (max-width:440px){.ship{grid-template-columns:1fr}}
label em{color:var(--crimson);font-style:normal}
.err{color:var(--crimson);font-size:14px;font-weight:700}
.how{margin:6px 0 0;padding:0;list-style:none;counter-reset:h;display:flex;flex-direction:column;gap:6px}
.how li{counter-increment:h;display:flex;gap:10px;align-items:baseline;font-size:15px;color:var(--ink)}
.how li::before{content:counter(h);flex:none;width:22px;height:22px;border-radius:50%;background:var(--crimson);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.ship[hidden]{display:none!important}

footer{background:var(--crimson);color:#FFE9EC}
footer .inner{padding-block:30px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:14px}
footer b{font-family:var(--f-serif);color:var(--white);font-size:17px}

/* ---------- phone ---------- */
@media (max-width:600px){
  body{font-size:15.5px;line-height:1.8}
  .rail .brand{display:none}
  .rail nav{margin-left:0}
  .rail a{padding:5px 8px}
  .ch{padding-block:52px}
  .ch-head{grid-template-columns:1fr;gap:4px;margin-bottom:26px}
  .ch-no{font-size:40px}
  .ch-head h2{font-size:25px;margin-top:2px}
  .cover .inner{padding-block:40px 44px;gap:28px}
  .cover h1{font-size:30px;line-height:1.3;margin:12px 0 14px}
  .cover h1 span{display:block}
  .toc{padding:14px 16px}
  .toc a{padding:6px 0;font-size:14px}
  .tl{grid-template-columns:1fr 1fr;column-gap:14px;row-gap:18px}
  .tl li{padding:14px 0 0}
  .tl .yr{font-size:24px}
  .tl b{font-size:15px}
  .tl span{font-size:14.5px;line-height:1.65}
  .quote{margin-top:32px;padding:22px 20px;gap:6px}
  .quote .q{font-size:48px}
  .quote blockquote{font-size:19px}
  .rows{gap:36px}
  .row .txt h3{font-size:20px}
  .proofs{margin-top:36px}
  .proof{padding:14px 10px}
  .proof span,.proof small{font-size:13px}
  .proof b{font-size:20px}
  .pair > div{padding:14px 16px}
  .pair b{font-size:16px}
  .scenes{grid-template-columns:1fr 1fr;gap:8px}
  .scene{padding:14px 12px;gap:4px}
  .scene b{font-size:15.5px}
  .scene span{font-size:14px;line-height:1.6}
  .scene .t{font-size:13px}
  .answer img{height:180px}
  .answer .body{padding:18px}
  .routine{margin-top:40px;padding:22px 18px;gap:18px}
  .ring{max-width:160px}
  .ring .sec{font-size:44px}
  .routine h3{font-size:20px}
  .rsteps{grid-template-columns:1fr;gap:8px}
  .rstep{display:grid;grid-template-columns:76px 1fr;align-items:center}
  .rstep img{aspect-ratio:1;height:76px}
  .rstep div{padding:10px 14px;font-size:14px;line-height:1.55}
  .rstep b{font-size:15px}
  .go{width:100%}
  .flip,.flip .card{min-height:150px}
  .flip .side{padding:18px}
  .flip .front b{font-size:18px}
  .idea{padding:18px}
  .steps{margin-top:36px;gap:14px}
  .reply{padding:20px 16px;gap:22px;border-radius:18px}
  .chip{padding:8px 13px;font-size:14px}
  footer .inner{flex-direction:column;gap:6px}
}
@media (max-width:360px){.scenes{grid-template-columns:1fr}}
/* music */
.music{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--white);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.music[aria-pressed="true"]{border-color:var(--crimson);color:var(--crimson);background:var(--blush)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.eq i{width:2px;height:4px;background:currentColor;border-radius:1px}
.music[aria-pressed="true"] .eq i{animation:eq 1s infinite ease-in-out}
.music[aria-pressed="true"] .eq i:nth-child(2){animation-delay:.2s}.music[aria-pressed="true"] .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}
@media (prefers-reduced-motion:reduce){.music[aria-pressed="true"] .eq i{animation:none;height:8px}}
.music-cta{margin-top:18px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer}
.music-cta[aria-pressed="true"]{background:#fff;color:var(--crimson)}

/* Original ambient music, synthesized live with Web Audio (no audio file, no licensing). */
function SiteMusic(win){
  /* Plays the licensed track "Cafe Lofi" (Pixabay, zephiramusic) from the page's own files: loop, gentle fade in/out. */
  var A=null,on=false,fade=null,TARGET=0.55,cbs=[];
  function el(){ if(!A){ A=new win.Audio('../assets/audio/cafe-lofi.mp3'); A.loop=true; A.preload='auto'; A.volume=0;
      ['play','playing','pause'].forEach(function(ev){A.addEventListener(ev,function(){cbs.forEach(function(f){try{f();}catch(e){}});});}); } return A; }
  function ramp(to,ms,done){ var a=el(); if(fade) win.clearInterval(fade); var from=a.volume,t0=Date.now();
    fade=win.setInterval(function(){ var k=Math.min(1,(Date.now()-t0)/ms); try{a.volume=Math.max(0,Math.min(1,from+(to-from)*k));}catch(e){} if(k>=1){ win.clearInterval(fade); fade=null; if(done) done(); } },50); }
  function tryPlay(){ var a=el(); var p=a.play(); if(p&&p.then){ p.then(function(){ ramp(TARGET,2200); }).catch(function(){}); } else ramp(TARGET,2200); }
  return {
    start:function(){ on=true; tryPlay(); },
    stop:function(){ on=false; if(A) ramp(0,900,function(){ if(!on) A.pause(); }); },
    unlock:function(){ if(on&&(!A||A.paused)) tryPlay(); },
    playing:function(){ return !!(on&&A&&!A.paused); },
    isOn:function(){ return on; },
    onState:function(fn){ if(cbs.indexOf(fn)<0) cbs.push(fn); },
    toggle:function(){ if(on) this.stop(); else this.start(); return on; },
    supported:typeof win.Audio==='function'
  };
}
